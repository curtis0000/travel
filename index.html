<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>行程</title>
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,600..800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    /* 雪影藍：雪地影子是藍紫色的。白紙＝雪，靛藍＝影子與夜空 */
    --bg: #ffffff;
    --ink: oklch(0.18 0.02 270);
    --ink-2: oklch(0.42 0.02 270);
    --ink-3: oklch(0.55 0.02 270);
    --line: oklch(0.90 0.01 270);
    --line-2: oklch(0.80 0.02 270);
    --brand: oklch(0.44 0.15 270);
    --brand-deep: oklch(0.32 0.14 270);
    --brand-tint: oklch(0.96 0.03 270);
    --brand-tint-2: oklch(0.92 0.05 270);
    --warn-bg: oklch(0.97 0.05 90); --warn-fg: oklch(0.42 0.10 75); --warn-line: oklch(0.85 0.10 90);
    --bad: oklch(0.52 0.20 25); --bad-tint: oklch(0.96 0.03 25);
    --cjk: "Noto Sans TC", "PingFang TC", "Hiragino Sans", sans-serif;
    --num: "Bricolage Grotesque", var(--cjk);
    --z-sticky: 10; --z-toast: 30;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.65 var(--cjk); }
  a { color: var(--brand); text-decoration-thickness: 1px; text-underline-offset: 3px; }
  main { max-width: 640px; margin: 0 auto; padding: 0 18px 96px; }
  button { font: inherit; color: inherit; }
  h1, h2, h3 { text-wrap: balance; font-feature-settings: "palt"; }
  .num, .t, .tab b, .dur, .min, .ord, .ends, .route-count, .list small, .hero .dates {
    font-family: var(--num); font-variant-numeric: tabular-nums; font-variation-settings: "wdth" 88;
  }

  /* header */
  header.hero { padding: 22px 0 18px; display: grid; grid-template-columns: 1fr auto; column-gap: 12px; align-items: start; }
  .hero .dates { grid-column: 1; font-weight: 700; font-size: 15px; color: var(--brand); letter-spacing: .01em; line-height: 1.2; }
  .hero h1 { grid-column: 1; font-weight: 900; font-size: 30px; line-height: 1.25; margin: 6px 0 0; word-break: keep-all; overflow-wrap: anywhere; }
  .hero .lede { grid-column: 1 / -1; color: var(--ink-2); font-size: 15px; margin: 10px 0 0; }
  .share {
    grid-column: 2; grid-row: 1 / 3; align-self: start; height: 40px; padding: 0 14px 0 12px; border-radius: 999px;
    border: 0; background: var(--brand); color: #fff; cursor: pointer; display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px;
  }
  .share svg { width: 17px; height: 17px; }
  .share:active { background: var(--brand-deep); }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px); opacity: 0; z-index: var(--z-toast);
    background: var(--ink); color: #fff; padding: 8px 16px; border-radius: 999px; font-size: 14px; transition: .25s cubic-bezier(.16,1,.3,1); pointer-events: none;
  }
  .toast.on { opacity: 1; transform: translateX(-50%); }

  /* day tabs：像車站站名牌 */
  nav.tabs {
    position: sticky; top: 0; z-index: var(--z-sticky); margin: 0 -18px; padding: 8px 18px;
    background: rgba(255,255,255,.94); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
    display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
  }
  nav.tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto; appearance: none; border: 1.5px solid var(--line-2); background: #fff; cursor: pointer; color: var(--ink-2);
    padding: 5px 12px 6px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; line-height: 1.15; min-width: 58px;
    transition: background .15s, color .15s, border-color .15s;
  }
  .tab b { font-weight: 800; font-size: 17px; letter-spacing: -.01em; }
  .tab small { font-size: 11px; margin-top: 2px; min-height: 13px; }
  .tab.ov b { font-family: var(--cjk); font-weight: 900; font-size: 15px; }
  .tab[aria-selected="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }
  .tab.today:not([aria-selected="true"]) { border-color: var(--brand); color: var(--brand); }

  /* panels */
  section.panel { display: none; padding-top: 22px; }
  section.panel.active { display: block; animation: rise .35s cubic-bezier(.16,1,.3,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { section.panel.active { animation: none; } .toast, .tab, .chev { transition: none; } }
  .panel h2 { font-size: 22px; font-weight: 900; margin: 0 0 16px; display: flex; align-items: baseline; gap: 10px; }
  .panel h2 .num { font-weight: 800; font-size: 34px; line-height: 1; color: var(--brand); letter-spacing: -.02em; }
  .panel h2 .num small { font-size: 13px; font-weight: 700; margin-right: 2px; }
  .panel h2 .ends { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--ink-3); }

  /* timeline：一天一條路線，一個地點一站 */
  ol.tl { list-style: none; margin: 0; padding: 0; }
  .tl li { display: grid; grid-template-columns: 54px 26px 1fr; column-gap: 8px; position: relative; }
  .tl .t { text-align: right; line-height: 1.1; padding-top: 11px; }
  .tl .t b { display: block; font-weight: 800; font-size: 17px; color: var(--brand-deep); letter-spacing: -.01em; }
  .tl .t span { display: block; font-size: 12px; font-weight: 600; color: var(--ink-3); margin-top: 3px; }
  .tl .rail { position: relative; }
  .tl .rail::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 6px; margin-left: -3px; background: var(--brand); }
  .tl li:first-child .rail::before { top: 16px; border-radius: 3px 3px 0 0; }
  .tl li:last-child .rail::before { bottom: auto; height: 16px; border-radius: 0 0 3px 3px; }
  .tl .rail i { position: absolute; left: 50%; top: 11px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: #fff; border: 4px solid var(--brand); }
  .tl li.node .rail i { width: 12px; height: 12px; margin-left: -6px; top: 13px; border-width: 3px; }

  .tl li.stay { padding: 6px 0 10px; }
  .card { padding: 2px 0 0; }
  .card .head { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; }
  .card .head h3 { margin: 0; font-size: 17px; font-weight: 800; line-height: 1.4; flex: 1; }
  .card .dur { flex: 0 0 auto; font-weight: 700; font-size: 12px; color: var(--brand); background: var(--brand-tint); padding: 3px 8px; border-radius: 999px; margin-top: 3px; }
  .card .map { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: var(--brand); background: var(--brand-tint); }
  .card .map:active { background: var(--brand-tint-2); }
  .card .map svg { width: 15px; height: 15px; }
  .card .chev { flex: 0 0 auto; width: 18px; height: 18px; margin-top: 6px; color: var(--ink-3); transition: transform .2s; transform-origin: center; }
  .card.open .chev { transform: rotate(180deg); }
  .card .note { display: none; margin-top: 8px; padding: 10px 12px; background: var(--brand-tint); border-radius: 10px; color: var(--ink-2); font-size: 14.5px; line-height: 1.7; overflow-wrap: anywhere; }
  .card.open .note { display: block; }
  .card.nonote .head { cursor: default; }

  .tl li.node { padding: 4px 0; }
  .tl li.node .t { padding-top: 9px; }
  .tl li.node .txt { padding: 6px 0; font-weight: 700; }
  .tl li.node .txt .sub { display: block; font-weight: 400; color: var(--ink-2); font-size: 14px; }

  .tl li.move .txt { padding: 6px 0 8px; font-size: 13.5px; color: var(--ink-2); display: flex; gap: 6px; align-items: flex-start; }
  .tl li.move .txt svg { flex: 0 0 auto; width: 14px; height: 14px; margin-top: 4px; color: var(--brand); }
  .tl li.move .txt .min { font-weight: 700; font-size: 12px; color: var(--brand-deep); background: var(--brand-tint); padding: 1px 7px; border-radius: 999px; margin-left: 6px; white-space: nowrap; }

  .tl li.gap .rail::before { background: repeating-linear-gradient(to bottom, var(--brand) 0 6px, transparent 6px 12px); }
  .tl li.gap .txt, .tl li.bad .txt { padding: 4px 0; font-size: 12.5px; }
  .tl li.gap .txt { color: var(--ink-3); }
  .tl li.bad .rail::before { background: var(--bad); }
  .tl li.bad .txt { color: var(--bad); font-weight: 800; }
  .tl li.bad .txt span { background: var(--bad-tint); padding: 1px 8px; border-radius: 999px; }

  .tl li.warn { grid-template-columns: 1fr; margin: 12px 0 6px; }
  .callout { background: var(--warn-bg); border: 1px solid var(--warn-line); color: var(--warn-fg); border-radius: 12px; padding: 10px 12px; font-size: 14.5px; display: flex; gap: 10px; }
  .callout::before { content: "注意"; flex: 0 0 auto; font-weight: 800; }

  ul.plain { margin: 14px 0 0; padding-left: 20px; color: var(--ink-2); }
  ul.plain li { margin: 4px 0; }
  .empty { color: var(--ink-3); }

  /* 總覽 */
  .doc { margin-top: 36px; }
  .doc.first { margin-top: 0; }
  #o h2 { font-size: 20px; font-weight: 900; margin: 34px 0 10px; display: block; }
  #o h2:first-child { margin-top: 0; }
  #o > p:first-child { font-size: 17px; line-height: 1.75; color: var(--ink); font-weight: 500; }
  .md p, .md li { color: var(--ink-2); font-size: 15px; }
  .md table { border-collapse: collapse; width: 100%; font-size: 14px; }
  .md th, .md td { border-bottom: 1px solid var(--line); padding: 8px 8px 8px 0; text-align: left; vertical-align: top; }
  .md th { font-weight: 800; color: var(--ink); border-bottom: 2px solid var(--ink); }
  .md li.task { list-style: none; margin-left: -20px; display: flex; gap: 12px; align-items: flex-start; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .md input[type=checkbox] { flex: 0 0 auto; width: 20px; height: 20px; margin: 3px 0 0; accent-color: var(--brand); cursor: pointer; }
  .md li.task.done { color: var(--ink-3); text-decoration: line-through; }
  @media (max-width: 600px) {
    .md table, .md tbody, .md tr, .md td { display: block; }
    .md thead { display: none; }
    .md tr { border-bottom: 1px solid var(--line); padding: 10px 0; }
    .md td { border: 0; padding: 2px 0; display: grid; grid-template-columns: 4.5em 1fr; gap: 8px; }
    .md td::before { content: attr(data-label); font-size: 13px; font-weight: 700; color: var(--ink-3); }
    .md td:first-child { font-weight: 800; color: var(--ink); }
  }

  /* 地點路線工具 */
  .places-intro { color: var(--ink-2); font-size: 14.5px; margin: 0 0 6px; }
  .pgroup { margin: 20px 0 2px; font-weight: 800; font-size: 14px; color: var(--brand); display: flex; align-items: center; gap: 8px; }
  ul.places { list-style: none; margin: 0; padding: 0; }
  ul.places li { border-bottom: 1px solid var(--line); }
  ul.places label { display: flex; align-items: center; gap: 14px; padding: 10px 2px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  ul.places input { position: absolute; opacity: 0; width: 0; height: 0; }
  ul.places .ord {
    flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line-2);
    display: grid; place-items: center; font-weight: 800; font-size: 14px; color: transparent; transition: .15s;
  }
  ul.places input:checked ~ .ord { background: var(--brand); border-color: var(--brand); color: #fff; }
  ul.places .pname { flex: 1; font-weight: 700; font-size: 16px; }
  ul.places input:checked ~ .pname { color: var(--brand-deep); }
  .route-bar {
    position: sticky; bottom: 0; margin: 20px -18px 0; padding: 12px 18px calc(12px + env(safe-area-inset-bottom));
    background: rgba(255,255,255,.94); backdrop-filter: blur(10px); border-top: 1px solid var(--line);
  }
  .modes { display: flex; gap: 6px; margin-bottom: 10px; }
  .modes label { flex: 1; text-align: center; font-size: 13px; font-weight: 600; padding: 7px 0; cursor: pointer; color: var(--ink-2); border: 1.5px solid var(--line-2); border-radius: 999px; }
  .modes input { position: absolute; opacity: 0; width: 0; height: 0; }
  .modes label:has(input:checked) { background: var(--brand-tint-2); border-color: var(--brand); color: var(--brand-deep); }
  .route-actions { display: flex; gap: 8px; align-items: center; }
  .btn-go {
    flex: 1; border: 0; border-radius: 999px; padding: 13px 16px; background: var(--brand); color: #fff; font-weight: 800; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-go svg { width: 18px; height: 18px; }
  .btn-go:disabled { background: var(--line); color: var(--ink-3); cursor: default; }
  .btn-clear { border: 1.5px solid var(--line-2); background: #fff; border-radius: 999px; padding: 12px 16px; cursor: pointer; color: var(--ink-2); font-weight: 600; }
  .route-count { font-size: 12px; font-weight: 600; color: var(--ink-3); margin-top: 8px; text-align: center; }

  /* list page */
  .list { margin-top: 12px; }
  .list a { display: block; padding: 18px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); font-size: 20px; font-weight: 800; }
  .list small { display: block; font-size: 13px; font-weight: 700; color: var(--brand); margin-top: 4px; }
  .err { color: var(--bad); }

  @media print {
    nav.tabs, .share, .route-bar { display: none; }
    section.panel { display: block !important; break-inside: avoid; }
    .card .note { display: block; }
  }
</style>
</head>
<body>
<main id="app">載入中…</main>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script>
/* ---------- md → 結構 ---------- */
const TIME_RE = /^(\d{1,2}):(\d{2})(?:\s*[–\-]\s*(\d{1,2}):(\d{2}))?\s+(.*)$/;
const toMin = (h, m) => +h * 60 + +m;
const fmt = min => {
  const m = ((min % 1440) + 1440) % 1440;
  return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
};
const durLabel = m => m < 60 ? `${m} 分` : (m % 60 ? `${Math.floor(m / 60)}h${String(m % 60).padStart(2, '0')}` : `${m / 60}h`);
const moveMinutes = s => {
  let n = 0;
  for (const x of s.matchAll(/(\d+(?:\.\d+)?)\s*小時/g)) n += Math.round(+x[1] * 60);
  for (const x of s.matchAll(/(\d+)\s*分/g)) n += +x[1];
  return n;
};
const inline = s => marked.parseInline(s.trim());
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function parseTrip(md) {
  const lines = md.replace(/\r/g, '').split('\n');
  const trip = { title: '行程', lede: '', overview: '', days: [], rest: '' };
  let section = 'top', cur = null, lastItem = null;
  const restBuf = [], ovBuf = [];
  const flushDay = () => { if (cur) trip.days.push(cur); cur = null; lastItem = null; };
  for (const raw of lines) {
    if (/^#\s+/.test(raw)) { trip.title = raw.replace(/^#\s+/, '').trim(); continue; }
    if (/^##\s+/.test(raw)) {
      flushDay();
      const h = raw.replace(/^##\s+/, '').trim();
      section = h === '每日行程' ? 'days' : h === '行程總覽' ? 'overview' : 'rest';
      if (section === 'rest') restBuf.push(raw);
      continue;
    }
    if (section === 'top') { if (raw.trim()) trip.lede += (trip.lede ? '\n' : '') + raw.trim(); continue; }
    if (section === 'rest') { restBuf.push(raw); continue; }
    if (section === 'overview') { ovBuf.push(raw); continue; }
    // ---- 每日行程 ----
    if (/^###\s+/.test(raw)) { flushDay(); cur = { label: raw.replace(/^###\s+/, '').trim(), items: [] }; continue; }
    if (!cur) continue;
    const t = raw.trim();
    if (!t) continue;
    const isBullet = /^[-*]\s+/.test(t);
    const isIndented = /^\s+/.test(raw) && !isBullet;
    if (isIndented && lastItem) {
      const body = t.replace(/^[→⇒>]\s*/, '');
      if (/^[→⇒]/.test(t)) lastItem.move = { text: body, min: moveMinutes(body) };
      else lastItem.note = (lastItem.note ? lastItem.note + ' ' : '') + t;
      continue;
    }
    if (!isBullet) { cur.items.push({ kind: 'plain', text: t }); continue; }
    const body = t.replace(/^[-*]\s+/, '');
    lastItem = null;
    if (/^\[[ xX]\]\s/.test(body)) { cur.items.push({ kind: 'task', done: /^\[[xX]\]/.test(body), text: body.slice(3).trim() }); continue; }
    if (/^注意[：:]/.test(body)) { cur.items.push({ kind: 'warn', text: body.replace(/^注意[：:]\s*/, '') }); continue; }
    const m = body.match(TIME_RE);
    if (!m) { cur.items.push({ kind: 'plain', text: body }); continue; }
    const start = toMin(m[1], m[2]);
    let end = m[3] ? toMin(m[3], m[4]) : null;
    if (end !== null && end < start) end += 1440;
    const rest = m[5];
    const ci = rest.indexOf('：');
    const item = {
      kind: end === null ? 'node' : 'stay', start, end,
      name: ci >= 0 ? rest.slice(0, ci).trim() : rest.trim(),
      note: ci >= 0 ? rest.slice(ci + 1).trim() : '',
      move: null,
    };
    cur.items.push(item); lastItem = item;
  }
  flushDay();
  trip.rest = restBuf.join('\n');
  trip.overview = ovBuf.join('\n');
  return trip;
}

/* ---------- 排程檢查：把 items 展開成時間軸列 ---------- */
function schedule(items) {
  const rows = [];
  let cursor = null, dayEnd = null, pendingMove = null;
  for (const it of items) {
    if (it.kind === 'plain' || it.kind === 'warn' || it.kind === 'task') { rows.push(it); continue; }
    let start = it.start, end = it.end;
    if (cursor !== null && start < cursor - 720) { start += 1440; if (end !== null) end += 1440; }
    if (pendingMove) rows.push({ kind: 'move', ...pendingMove });
    if (cursor !== null) {
      const gap = start - cursor;
      if (gap < 0) rows.push({ kind: 'bad', min: -gap });
      else if (gap > 0) rows.push({ kind: 'gap', min: gap });
    }
    rows.push({ ...it, start, end });
    cursor = (end !== null ? end : start) + (it.move ? it.move.min : 0);
    dayEnd = end !== null ? end : start;
    pendingMove = it.move;
  }
  if (pendingMove) { rows.push({ kind: 'move', ...pendingMove }); dayEnd = cursor; }
  return { rows, dayEnd };
}

/* ---------- render ---------- */
const ICON_MOVE = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v12M4 10l4 4 4-4"/></svg>';
const ICON_CHEV = '<svg class="chev" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7l5 5 5-5"/></svg>';
const ICON_PIN = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 14.5s4.5-4.2 4.5-8a4.5 4.5 0 0 0-9 0c0 3.8 4.5 8 4.5 8z"/><circle cx="8" cy="6.5" r="1.6"/></svg>';
const ICON_SHARE = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 12V3M6.5 6.5L10 3l3.5 3.5"/><path d="M4 10v6a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-6"/></svg>';
const mapUrl = name => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(name.replace(/<[^>]+>/g, ''));
const taskHtml = (text, done, key) => `<li class="task${done ? ' done' : ''}"><input type="checkbox" data-key="${esc(key)}"${done ? ' checked' : ''}><span>${inline(text)}</span></li>`;

function renderRow(r, dayIdx, i) {
  switch (r.kind) {
    case 'stay': {
      const hasNote = !!r.note;
      return `<li class="stay"><div class="t"><b>${fmt(r.start)}</b><span>${fmt(r.end)}</span></div><div class="rail"><i></i></div>
        <div class="card${hasNote ? '' : ' nonote'}"><div class="head"><h3>${inline(r.name)}</h3><span class="dur">${durLabel(r.end - r.start)}</span>
        <a class="map" href="${mapUrl(r.name)}" target="_blank" rel="noopener" aria-label="在 Google Maps 開啟" title="地圖">${ICON_PIN}</a>${hasNote ? ICON_CHEV : ''}</div>
        ${hasNote ? `<div class="note">${inline(r.note)}</div>` : ''}</div></li>`;
    }
    case 'node':
      return `<li class="node"><div class="t"><b>${fmt(r.start)}</b></div><div class="rail"><i></i></div>
        <div class="txt">${inline(r.name)}${r.note ? `<span class="sub">${inline(r.note)}</span>` : ''}</div></li>`;
    case 'move':
      return `<li class="move"><div class="t"></div><div class="rail"></div>
        <div class="txt">${ICON_MOVE}<span>${inline(r.text)}${r.min ? `<span class="min">${r.min} 分</span>` : ''}</span></div></li>`;
    case 'gap':
      return `<li class="gap"><div class="t"></div><div class="rail"></div><div class="txt">自由時間 ${durLabel(r.min)}</div></li>`;
    case 'bad':
      return `<li class="bad"><div class="t"></div><div class="rail"></div><div class="txt"><span>時間不夠，差 ${r.min} 分</span></div></li>`;
    case 'warn':
      return `<li class="warn"><div class="callout">${inline(r.text)}</div></li>`;
    default: return '';
  }
}

function renderDay(day, idx) {
  const { rows, dayEnd } = schedule(day.items);
  const timed = rows.filter(r => r.kind !== 'plain' && r.kind !== 'task');
  const plain = rows.filter(r => r.kind === 'plain' || r.kind === 'task');
  const ends = dayEnd !== null ? `<span class="ends">結束約 ${dayEnd >= 1440 ? '翌 ' : ''}${fmt(dayEnd)}</span>` : '';
  const plainHtml = plain.map((p, i) => p.kind === 'task' ? taskHtml(p.text, p.done, `d${idx}:${p.text}`) : `<li>${inline(p.text)}</li>`).join('');
  return `<section class="panel day md" id="d${idx}" data-idx="${idx}"><h2><span class="num"><small>Day</small>${idx + 1}</span>${esc(day.label)}${ends}</h2>
    ${timed.length ? `<ol class="tl">${timed.map(r => renderRow(r, idx)).join('')}</ol>` : (plain.length ? '' : '<p class="empty">這天還沒排行程</p>')}
    ${plain.length ? `<ul class="plain">${plainHtml}</ul>` : ''}
  </section>`;
}

function dayDates(trip) {
  // 從標題抓年份，配合每天標籤的 月/日 推出日期；跨年時月份變小就 +1 年
  const y = (trip.title.match(/(\d{4})\/\d{1,2}\/\d{1,2}/) || [])[1];
  if (!y) return trip.days.map(() => null);
  let year = +y, prevMonth = 0;
  return trip.days.map(d => {
    const m = d.label.match(/(\d{1,2})\/(\d{1,2})/);
    if (!m) return null;
    if (+m[1] < prevMonth) year++;
    prevMonth = +m[1];
    return `${year}-${String(m[1]).padStart(2, '0')}-${String(m[2]).padStart(2, '0')}`;
  });
}

function renderTrip(trip) {
  const dates = dayDates(trip);
  const now = new Date();
  const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
  const todayIdx = dates.indexOf(todayStr);
  const hasOv = !!(trip.overview.trim() || trip.rest.trim());
  const places = trip.days.flatMap((d, i) => d.items.filter(it => it.kind === 'stay').map(it => ({ name: it.name, day: (d.label.match(/^\d{1,2}\/\d{1,2}/) || [d.label])[0], dayIdx: i })));
  const h = location.hash;
  const hashIdx = +(h.match(/^#d(\d+)$/) || [])[1];
  let active;
  if (h === '#o' && hasOv) active = 'o';
  else if (h === '#p' && places.length) active = 'p';
  else if (Number.isInteger(hashIdx) && trip.days[hashIdx]) active = String(hashIdx);
  else if (todayIdx >= 0) active = String(todayIdx);
  else active = hasOv ? 'o' : '0';
  const range = (trip.title.match(/（(.+?)）\s*$/) || [])[1] || '';
  const title = range ? trip.title.replace(/（.+?）\s*$/, '') : trip.title;

  const tabs = (hasOv ? `<button class="tab ov" role="tab" aria-selected="${active === 'o'}" data-idx="o"><b>總覽</b><small></small></button>` : '') +
    trip.days.map((d, i) => {
      const m = d.label.match(/^(\d{1,2}\/\d{1,2})\s*[（(]?([^）)]*)[）)]?/);
      const big = m ? m[1] : d.label, small = m ? m[2] : '';
      return `<button class="tab${i === todayIdx ? ' today' : ''}" role="tab" aria-selected="${active === String(i)}" data-idx="${i}"><b>${esc(big)}</b><small>${esc(small)}</small></button>`;
    }).join('') +
    (places.length ? `<button class="tab ov" role="tab" aria-selected="${active === 'p'}" data-idx="p"><b>地點</b><small></small></button>` : '');

  return `<header class="hero"><div class="dates">${esc(range)}</div><h1>${esc(title)}</h1>${trip.lede ? `<p class="lede">${inline(trip.lede)}</p>` : ''}
      <button class="share" id="share" aria-label="分享" title="分享">${ICON_SHARE}<span>分享</span></button></header>
    ${trip.days.length || hasOv ? `<nav class="tabs" role="tablist">${tabs}</nav>` : ''}
    ${hasOv ? `<section class="panel md" id="o" data-idx="o">${marked.parse(trip.overview)}${trip.rest.trim() ? `<div class="doc${trip.overview.trim() ? '' : ' first'}">${marked.parse(trip.rest)}</div>` : ''}</section>` : ''}
    ${trip.days.map(renderDay).join('')}
    ${places.length ? renderPlaces(places, trip.days) : ''}`;
}

function renderPlaces(places, days) {
  const groups = days.map((d, i) => {
    const ps = places.filter(p => p.dayIdx === i);
    if (!ps.length) return '';
    return `<div class="pgroup">Day ${i + 1}<span>${esc(d.label)}</span></div><ul class="places">${ps.map(p =>
      `<li><label><input type="checkbox" data-name="${esc(p.name)}"><span class="ord"></span><span class="pname">${inline(p.name)}</span></label></li>`).join('')}</ul>`;
  }).join('');
  return `<section class="panel md" id="p" data-idx="p"><h2>地點路線</h2>
    <p class="places-intro">照你想走的順序依次點選地點，再按下方按鈕，Google Maps 會照這個順序畫出路線。</p>
    ${groups}
    <div class="route-bar">
      <div class="modes">
        <label><input type="radio" name="mode" value="walking" checked>步行</label>
        <label><input type="radio" name="mode" value="transit">大眾運輸</label>
        <label><input type="radio" name="mode" value="driving">開車</label>
      </div>
      <div class="route-actions">
        <button class="btn-go" id="route-go" disabled>${ICON_PIN}<span>Google Maps 開路線</span></button>
        <button class="btn-clear" id="route-clear">清除</button>
      </div>
      <div class="route-count" id="route-count">還沒選地點</div>
    </div>
  </section>`;
}

/* ---------- 互動 ---------- */
const toast = msg => {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('on'), 1800);
};

function bind(app, tripId) {
  // 分頁
  const show = idx => {
    app.querySelectorAll('.tab').forEach(t => {
      t.setAttribute('aria-selected', t.dataset.idx === idx);
      if (t.dataset.idx === idx) t.scrollIntoView({ block: 'nearest', inline: 'center' });
    });
    app.querySelectorAll('.panel').forEach(d => d.classList.toggle('active', d.dataset.idx === idx));
    history.replaceState(null, '', idx === 'o' ? '#o' : idx === 'p' ? '#p' : `#d${idx}`);
  };
  app.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => show(t.dataset.idx)));
  const first = app.querySelector('.tab[aria-selected="true"]');
  if (first) show(first.dataset.idx);
  window.addEventListener('hashchange', () => {
    const idx = location.hash === '#o' ? 'o' : location.hash === '#p' ? 'p' : (location.hash.match(/^#d(\d+)$/) || [])[1];
    if (idx !== undefined && app.querySelector(`.panel[data-idx="${idx}"]`)) show(idx);
  });

  // 色塊展開
  app.querySelectorAll('.card:not(.nonote) .head').forEach(h => h.addEventListener('click', e => {
    if (e.target.closest('a')) return;
    h.parentElement.classList.toggle('open');
  }));

  // 表格 → 手機卡片用的欄名
  app.querySelectorAll('.md table').forEach(tb => {
    const heads = [...tb.querySelectorAll('thead th')].map(th => th.textContent.trim());
    tb.querySelectorAll('tbody tr').forEach(tr => [...tr.children].forEach((td, i) => td.setAttribute('data-label', heads[i] || '')));
  });

  // 待辦：marked 產生的 disabled checkbox 改成可勾，狀態存 localStorage
  const storeKey = `trip:${tripId}:tasks`;
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(storeKey) || '{}'); } catch (e) {}
  app.querySelectorAll('.md li').forEach((li, i) => {
    if (li.closest('ul.places')) return;
    const cb = li.querySelector(':scope > input[type=checkbox]');
    if (!cb) return;
    li.classList.add('task');
    cb.disabled = false;
    if (!cb.dataset.key) cb.dataset.key = `r:${li.textContent.trim()}`;
    if (!li.querySelector(':scope > span')) {
      const span = document.createElement('span');
      while (cb.nextSibling) span.appendChild(cb.nextSibling);
      li.appendChild(span);
    }
  });
  app.querySelectorAll('.md li.task input[type=checkbox]').forEach(cb => {
    const key = cb.dataset.key;
    if (key in saved) cb.checked = saved[key];
    cb.closest('li').classList.toggle('done', cb.checked);
    cb.addEventListener('change', () => {
      saved[key] = cb.checked;
      cb.closest('li').classList.toggle('done', cb.checked);
      try { localStorage.setItem(storeKey, JSON.stringify(saved)); } catch (e) {}
    });
  });

  // 地點路線
  const goBtn = document.getElementById('route-go');
  if (goBtn) {
    const boxes = [...app.querySelectorAll('ul.places input[type=checkbox]')];
    const countEl = document.getElementById('route-count');
    const order = [];
    const refresh = () => {
      boxes.forEach(b => { const i = order.indexOf(b); b.parentElement.querySelector('.ord').textContent = i >= 0 ? i + 1 : ''; });
      goBtn.disabled = order.length < 2;
      countEl.textContent = order.length ? `已選 ${order.length} 個地點${order.length > 10 ? '（Google Maps 最多 10 個，只會帶前 10 個）' : ''}` : '還沒選地點';
    };
    boxes.forEach(b => b.addEventListener('change', () => {
      if (b.checked) order.push(b); else order.splice(order.indexOf(b), 1);
      refresh();
    }));
    document.getElementById('route-clear').addEventListener('click', () => { boxes.forEach(b => b.checked = false); order.length = 0; refresh(); });
    goBtn.addEventListener('click', () => {
      const names = order.slice(0, 10).map(b => b.dataset.name);
      const mode = (app.querySelector('input[name=mode]:checked') || {}).value || 'walking';
      const q = encodeURIComponent;
      const url = `https://www.google.com/maps/dir/?api=1&origin=${q(names[0])}&destination=${q(names[names.length - 1])}` +
        (names.length > 2 ? `&waypoints=${names.slice(1, -1).map(q).join('|')}` : '') + `&travelmode=${mode}`;
      window.open(url, '_blank', 'noopener');
    });
  }

  // 分享
  const share = document.getElementById('share');
  if (share) share.addEventListener('click', async () => {
    const url = location.href;
    if (navigator.share) { try { await navigator.share({ title: document.title, url }); } catch (e) {} return; }
    try { await navigator.clipboard.writeText(url); toast('已複製網址'); } catch (e) { toast('複製失敗，請手動複製網址'); }
  });
}

/* ---------- main ---------- */
(async () => {
  const app = document.getElementById('app');
  const id = new URLSearchParams(location.search).get('trip');
  try {
    if (!id) {
      const trips = await (await fetch('trips/index.json')).json();
      app.innerHTML = `<header class="hero"><h1>行程</h1></header><div class="list">` +
        trips.map(t => `<a href="?trip=${encodeURIComponent(t.id)}">${esc(t.title)}<small>${esc(t.dates)}</small></a>`).join('') + '</div>';
      return;
    }
    const res = await fetch(`trips/${encodeURIComponent(id)}.md`);
    if (!res.ok) throw new Error('找不到行程：' + id);
    const trip = parseTrip(await res.text());
    document.title = trip.title;
    app.innerHTML = renderTrip(trip);
    bind(app, id);
  } catch (e) {
    app.innerHTML = `<p class="err">${esc(e.message)}</p><p><a href="./">回行程列表</a></p>`;
  }
})();
</script>
</body>
</html>
